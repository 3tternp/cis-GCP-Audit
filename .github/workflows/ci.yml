name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The unit tests and demo mode need no third-party packages (google-auth is imported lazily),
      # but install the requirements so the real client import path is exercised too.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile all modules
        run: python -m compileall -q gcp_cis_audit tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI demo smoke test
        run: python -m gcp_cis_audit --cli --demo --json demo-report.json --html demo-report.html || test $? -eq 1
        shell: bash

      - name: Real client imports with google-auth installed
        run: python -c "import gcp_cis_audit.client as c; c.GcpClient"
